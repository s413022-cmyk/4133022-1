    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            color: #fff;
        }

        /* Neon & Glassmorphism Effects */
        .neon-title {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(168, 85, 247, 0.6);
        }
        .neon-box {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(236, 72, 153, 0.2);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* 3D Crank Knob Simulation */
        .crank-knob {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        .crank-knob.spinning {
            transform: rotate(360deg);
        }

        /* Modal Animations */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s ease-out forwards;
        }

        /* Capsule Bounce Animation */
        @keyframes capsuleDrop {
            0% { transform: translateY(-120px) rotate(0deg); opacity: 0; }
            60% { transform: translateY(0px) rotate(180deg); opacity: 1; }
            75% { transform: translateY(-15px) rotate(220deg); }
            90% { transform: translateY(0px) rotate(240deg); }
            100% { transform: translateY(-4px) rotate(240deg); }
        }
        .animate-capsule-drop {
            animation: capsuleDrop 0.8s ease-out forwards;
        }

        /* Pulsing Glow */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(236,72,153,0.6)); }
            50% { filter: drop-shadow(0 0 20px rgba(168,85,247,0.9)); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>

        // --- 1. Sound Generator (Web Audio API) ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCoin() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playCrank() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            playPop() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            playVictory(isSSR) {
                if (this.muted) return;
                this.init();
                const notes = isSSR ? [523.25, 659.25, 783.99, 1046.50] : [440, 554.37, 659.25];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.1;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = isSSR ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }
        }

            currentExitPet: null
        };

        function loadState() {
            const saved = localStorage.getItem('cyber_gacha_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.coins = parsed.coins ?? 100;
                    state.unlocked = parsed.unlocked ?? {};
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        function saveState() {
            localStorage.setItem('cyber_gacha_save', JSON.stringify({
                coins: state.coins,
                unlocked: state.unlocked
            }));
            updateUI();
        }

        // --- 4. Interactive Machine Canvas Animation ---
        const canvas = document.getElementById('gachaCanvas');
        const ctx = canvas.getContext('2d');
        let balls = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas(); initBalls(); });

        const BALL_COLORS = ['#ec4899', '#a855f7', '#38bdf8', '#4ade80', '#facc15'];

        function initBalls() {
            balls = [];
            const count = 18;
            for (let i = 0; i < count; i++) {
                balls.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: Math.random() * (canvas.height - 50) + 25,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    r: 16,
                    color: BALL_COLORS[i % BALL_COLORS.length]
                });
            }
        }

        function animateMachine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Bouncing Gacha Capsules in Dome
            balls.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                // Wall collisions
                if (b.x - b.r < 10 || b.x + b.r > canvas.width - 10) b.vx *= -1;
                if (b.y - b.r < 10 || b.y + b.r > canvas.height - 10) b.vy *= -1;

                // Draw 2-Tone Gacha Ball
                ctx.save();
                ctx.translate(b.x, b.y);

                // Bottom Half Color
                ctx.beginPath();
                ctx.arc(0, 0, b.r, 0, Math.PI);
                ctx.fillStyle = b.color;
                ctx.fill();

                // Top Half Transparent White
                ctx.beginPath();
                ctx.arc(0, 0, b.r, Math.PI, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();

                // Center Seam Line
                ctx.beginPath();
                ctx.moveTo(-b.r, 0);
                ctx.lineTo(b.r, 0);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Shine
                ctx.beginPath();
                ctx.arc(-b.r * 0.3, -b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();

                ctx.restore();
            });

            requestAnimationFrame(animateMachine);
        }

        function shuffleBalls() {
            balls.forEach(b => {
                b.vx = (Math.random() - 0.5) * 16;
                b.vy = (Math.random() - 0.5) * 16;
            });
            setTimeout(() => {
                balls.forEach(b => {
                    b.vx = (Math.random() - 0.5) * 2;
                    b.vy = (Math.random() - 0.5) * 2;
                });
            }, 800);
        }

        // --- 5. Gacha Pull Core Logic ---
        function drawRandomPet() {
            const rand = Math.random() * 100;
            let targetRarity = 'N';
            if (rand < 5) targetRarity = 'SSR';        // 5%
            else if (rand < 20) targetRarity = 'SR';    // 15%
            else if (rand < 50) targetRarity = 'R';     // 30%
            else targetRarity = 'N';                    // 50%

            const pool = PET_DATABASE.filter(p => p.rarity === targetRarity);
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function triggerPull() {
            if (state.isSpinning) return;
            if (state.coins < 10) {
                alert('金幣不足！點擊左上角 +100 補充金幣。');
                return;
            }

            state.coins -= 10;
            state.isSpinning = true;
            saveState();

            // Sound & Crank Animation
            audio.playCoin();
            setTimeout(() => {
                audio.playCrank();
                document.getElementById('crankKnob').classList.add('spinning');
                shuffleBalls();
            }, 200);

            // Spawn Capsule in Exit Tray after knob turn
            setTimeout(() => {
                document.getElementById('crankKnob').classList.remove('spinning');
                state.currentExitPet = drawRandomPet();
                spawnCapsuleInTray(state.currentExitPet.color);
                state.isSpinning = false;
            }, 800);
        }

        function spawnCapsuleInTray(color) {
            const tray = document.getElementById('exitTray');
            tray.innerHTML = `
                <div id="droppedCapsule" class="animate-capsule-drop relative w-12 h-12 rounded-full cursor-pointer shadow-lg flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full" style="background: linear-gradient(to bottom, rgba(255,255,255,0.9) 50%, ${color} 50%); border: 2px solid #1e293b;"></div>
                    <span class="relative text-[10px] font-black text-slate-800 bg-white/80 px-1 rounded">TAP!</span>
                </div>
            `;
            state.hasCapsuleInExit = true;

            document.getElementById('droppedCapsule').addEventListener('click', openCapsule);
        }

        function openCapsule() {
            if (!state.hasCapsuleInExit || !state.currentExitPet) return;

            const pet = state.currentExitPet;
            audio.playPop();

            // Record Collection
            state.unlocked[pet.id] = (state.unlocked[pet.id] || 0) + 1;
            saveState();

            // Clear Exit Tray
            document.getElementById('exitTray').innerHTML = '';
            state.hasCapsuleInExit = false;

            // Show Reward Modal
            showRewardModal(pet);
        }

        function showRewardModal(pet) {
            const modal = document.getElementById('rewardModal');
            const rarityBadge = document.getElementById('rewardRarityBadge');
            const artContainer = document.getElementById('rewardArtContainer');

            // Set Rarity Color Styles
            const rarityColors = {
                'SSR': 'bg-pink-500 text-white shadow-[0_0_15px_rgba(236,72,153,0.8)]',
                'SR': 'bg-purple-600 text-white shadow-[0_0_15px_rgba(168,85,247,0.8)]',
                'R': 'bg-cyan-500 text-slate-950 shadow-[0_0_15px_rgba(56,189,248,0.8)]',
                'N': 'bg-emerald-500 text-slate-950'
            };

            rarityBadge.className = `px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest mb-3 ${rarityColors[pet.rarity]}`;
            rarityBadge.innerText = pet.rarity;

            document.getElementById('rewardName').innerText = pet.name;
            document.getElementById('rewardDesc').innerText = pet.desc;
            document.getElementById('rewardDupCount').innerText = `已累積擁有: ${state.unlocked[pet.id]} 只`;

            artContainer.innerHTML = pet.svg;

            modal.classList.remove('hidden');

            // Victory Audio & Confetti
            const isSSR = pet.rarity === 'SSR';
            audio.playVictory(isSSR);

            if (isSSR || pet.rarity === 'SR') {
                confetti({
                    particleCount: isSSR ? 120 : 60,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // --- 6. Gallery Modal Update ---
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            let unlockedTypesCount = 0;

            PET_DATABASE.forEach(pet => {
                const count = state.unlocked[pet.id] || 0;
                const isUnlocked = count > 0;
                if (isUnlocked) unlockedTypesCount++;

                const card = document.createElement('div');
                card.className = `relative rounded-2xl border p-2 flex flex-col items-center justify-between text-center ${
                    isUnlocked 
                        ? 'bg-slate-900/90 border-purple-500/50 shadow-md' 
                        : 'bg-slate-950/60 border-slate-800 opacity-50 grayscale'
                }`;

                card.innerHTML = `
                    <span class="absolute top-1.5 left-2 text-[9px] font-black px-1.5 py-0.5 rounded ${
                        pet.rarity === 'SSR' ? 'bg-pink-500 text-white' :
                        pet.rarity === 'SR' ? 'bg-purple-500 text-white' :
                        pet.rarity === 'R' ? 'bg-cyan-500 text-black' : 'bg-slate-700 text-white'
                    }">${pet.rarity}</span>
                    
                    ${isUnlocked ? `<span class="absolute top-1.5 right-2 text-[9px] bg-slate-800 text-amber-300 font-bold px-1.5 py-0.5 rounded-full">x${count}</span>` : ''}

                    <div class="w-16 h-16 my-2 flex items-center justify-center">
                        ${isUnlocked ? pet.svg : '<i class="fa-solid fa-lock text-2xl text-slate-600"></i>'}
                    </div>

                    <div class="text-xs font-extrabold ${isUnlocked ? 'text-white' : 'text-slate-500'} truncate w-full">
                        ${isUnlocked ? pet.name : '???'}
                    </div>
                `;
                grid.appendChild(card);
            });

            const percent = Math.round((unlockedTypesCount / PET_DATABASE.length) * 100);
            document.getElementById('galleryPercent').innerText = `${percent}%`;
            document.getElementById('galleryProgressText').innerText = `${unlockedTypesCount} / ${PET_DATABASE.length} (${percent}%)`;
        }

        // --- 7. UI Sync & Listeners ---
        function updateUI() {
            document.getElementById('coinCount').innerText = state.coins;
            renderGallery();
        }

        document.getElementById('pullBtn').addEventListener('click', triggerPull);
        document.getElementById('crankArea').addEventListener('click', triggerPull);

        document.getElementById('addCoinBtn').addEventListener('click', () => {
            state.coins += 100;
            audio.playCoin();
            saveState();
        });

        document.getElementById('galleryBtn').addEventListener('click', () => {
            renderGallery();
            document.getElementById('galleryModal').classList.remove('hidden');
        });

        document.getElementById('closeGalleryBtn').addEventListener('click', () => {
            document.getElementById('galleryModal').classList.add('hidden');
        });

        document.getElementById('closeRewardBtn').addEventListener('click', () => {
            document.getElementById('rewardModal').classList.add('hidden');
        });

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            audio.muted = !audio.muted;
            document.getElementById('soundIcon').className = audio.muted ? 'fa-solid fa-volume-xmark text-lg' : 'fa-solid fa-volume-high text-lg';
        });

        document.getElementById('resetDataBtn').addEventListener('click', () => {
            if (confirm('確定要重置所有扭蛋進度與金幣嗎？')) {
                localStorage.removeItem('cyber_gacha_save');
                state.coins = 100;
                state.unlocked = {};
                saveState();
            }
        });

        // App Initialization
        resizeCanvas();
        initBalls();
        animateMachine();
        loadState();
    </script>
</body>
</html>
